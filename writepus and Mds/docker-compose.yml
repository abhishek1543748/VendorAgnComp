services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/compliance
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
